# Wakes the free-tier backend if it has gone to sleep (after a redeploy or a
# platform restart), and keeps it warm alongside the backend's own self-ping.
#
# Setup: repository Settings -> Secrets and variables -> Actions -> Variables
#   KEEPALIVE_URL = https://<your-service>.onrender.com
# Without the variable this workflow does nothing.
#
# GitHub may delay scheduled runs by a few minutes and pauses schedules after
# 60 days without repository activity; the backend's self-ping covers the gaps.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEPALIVE_URL is not set; nothing to do."
            exit 0
          fi
          # A cold start can take up to a minute; allow for it.
          curl --fail --silent --show-error --retry 4 --retry-delay 15 \
               --retry-all-errors --max-time 90 "$URL/health?source=github" | head -c 400
