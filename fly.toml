# Backend on Fly.io. Create a Postgres cluster and attach it (sets DATABASE_URL):
#   fly launch --no-deploy --copy-config
#   fly postgres create && fly postgres attach <pg-app>
#   fly secrets set SECRET_KEY=... RELIABILITY_ENV=production CORS_ORIGINS=https://<dashboard> \
#                   SUPERVISOR_LLM_PROVIDER=gemini GEMINI_API_KEY=...
#   fly deploy
app = "reliability-supervisor"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  RELIABILITY_ENV = "production"
  EVENT_BUS = "memory"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine: the in-process event bus does not fan out across machines.
  auto_stop_machines = "off"
  min_machines_running = 1
  max_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "5s"
