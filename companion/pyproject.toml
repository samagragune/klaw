[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klaw-companion"
version = "0.2.0"
description = "Connects local agent environments (Claude Code) to a Klaw supervisor."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
klaw-companion = "klaw_companion.cli:main"

[tool.setuptools.packages.find]
include = ["klaw_companion*"]
