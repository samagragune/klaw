[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-sdk"
version = "0.2.0"
description = "Observability and execution control for autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.24"]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[tool.setuptools.packages.find]
include = ["reliability*"]
